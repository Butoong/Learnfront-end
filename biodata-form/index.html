<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Form</Form></title>
</head>
<body>
    <h1>Data Diri</h1>

    <label for="full-name">Nama Lengkap</label>
    <input
        type="text"
        id="full-name"
        name="fullname"
        required
    >

    <label>Jenis Kelamin</label>
    <input
        type="radio"
        id="male-id"
        name="male"
        value="choosemale"
    >
    <label for="male-id">Laki-laki</label>
    <input
        type="radio"
        id="female-id"
        name="female"
        value="choosefemale"
    >
    <label for="female-id">Perempuan</label>
    
</body>
</html>
