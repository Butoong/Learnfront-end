<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Simple Form</title>
</head>
<body>
    <h1>LOGIN</h1>

    <label for="username">User Name</label>
    <input 
        type="name"
        id="username"
        name="username"
        required
    >
    <label for="userpassword">Password</label>
    <input
        type="password"
        id="userpassword"
        name="userpassword"
        required
    >

    <div class="me-remember">
    <input 
        type="checkbox" 
        id="remember-me" 
        name="remember-me"
    >
    <label for="remember-me">Ingat Saya</label>
    </div>

    <button>LOGIN</button>

    <p><a href="#">Belum Punya Akun? Daftar</a></p>
   
</body>
</html>
